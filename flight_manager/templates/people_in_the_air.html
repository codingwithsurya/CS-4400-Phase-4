
{% load static %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container-fluid py-4 w-100">
<div class="card shadow-sm">
<div class="card-header bg-white">    
<h2 class="mb-4 table-secondary" >People in the Air</h2>

<table class="table table-striped table-hover">
    <thead>
        <tr>
            {% for i in columns %}
                <th>{{ i }}</th>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
        {% for j in data %}
            <tr>
                {% for val in j %}
                    <td>{{ val }}</td>
                {% endfor %}
            </tr>
        {% endfor %}
    </tbody>
</table>
</div>
</div>
<a href="{% url 'index' %}" class="btn btn-secondary ms-2">Home</a>
</div>
