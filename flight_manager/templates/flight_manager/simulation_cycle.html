{% extends 'base.html' %}

{% block title %}Simulation Cycle{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header bg-warning text-dark">
        <h5 class="card-title mb-0">Simulation Cycle</h5>
    </div>
    <div class="card-body">
        <p class="alert alert-info">A simulation cycle will update the state of all flights according to simulation parameters.</p>
        
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-warning">Run Simulation Cycle</button>
        </form>
    </div>
</div>
{% endblock %}
