{% load static %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'main.css' %}">

<div class="container">

<h2>Route Summary</h2>

<table class="table table-striped table-hover">
    <thead>
        <tr>
            {% for i in columns %}
                <th>{{ i }}</th>
            {% endfor %}
        </tr>
    </thead>
    <tbody>
        {% for j in data %}
            <tr>
                {% for val in j %}
                    <td>{{ val }}</td>
                {% endfor %}
            </tr>
        {% endfor %}
    </tbody>
</table>
</div>
